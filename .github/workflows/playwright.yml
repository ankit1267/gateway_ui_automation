name: Playwright Tests
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write   # REQUIRED for GitHub Pages push
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_USER_DATA_DIR: ${{ secrets.PLAYWRIGHT_USER_DATA_DIR }}
      PLAYWRIGHT_LOGIN_URL: ${{ secrets.PLAYWRIGHT_LOGIN_URL }}
      PLAYWRIGHT_SUCCESS_URL: ${{ secrets.PLAYWRIGHT_SUCCESS_URL }}
      PLAYWRIGHT_BROWSER_CHANNEL: ${{ secrets.PLAYWRIGHT_BROWSER_CHANNEL }}
      PLAYWRIGHT_HEADLESS: ${{ secrets.PLAYWRIGHT_HEADLESS }}
      PLAYWRIGHT_AUTH_STATE: ${{ secrets.PLAYWRIGHT_AUTH_STATE }}
      WORKSPACE_NAME: ${{ secrets.WORKSPACE_NAME }}
      AGENT_NAME: ${{ secrets.AGENT_NAME }}
      ORG_ID: ${{ secrets.ORG_ID }}
      BASE_URL: ${{ secrets.BASE_URL }}
      CHATBOT_AGENT: ${{ secrets.CHATBOT_AGENT }}
      TESTING_AGENT: ${{ secrets.TESTING_AGENT }}
      AGENT_ID: ${{ secrets.AGENT_ID }}
      CHATBOT_AGENT_ID: ${{ secrets.CHATBOT_AGENT_ID }}
      TESTING_AGENT_ID: ${{ secrets.TESTING_AGENT_ID }}
      GTWY_AUTOMATION_TOKEN: ${{ secrets.GTWY_AUTOMATION_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload Pages artifact
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: playwright-report

  deploy:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send Report URL to Webhook
        run: |
          curl -X POST https://flow.sokt.io/func/scri8acRJpTe \
          -H "Content-Type: application/json" \
          -d "{\"report_url\":\"${{ steps.deployment.outputs.page_url }}\"}"
