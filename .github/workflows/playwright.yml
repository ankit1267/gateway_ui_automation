name: Playwright Tests
on:
  schedule:
    - cron: '0 6 * * *' 
  workflow_dispatch:
permissions:
  contents: write   # REQUIRED for GitHub Pages push
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_USER_DATA_DIR: ${{ secrets.PLAYWRIGHT_USER_DATA_DIR }}
      PLAYWRIGHT_LOGIN_URL: ${{ secrets.PLAYWRIGHT_LOGIN_URL }}
      PLAYWRIGHT_SUCCESS_URL: ${{ secrets.PLAYWRIGHT_SUCCESS_URL }}
      PLAYWRIGHT_BROWSER_CHANNEL: ${{ secrets.PLAYWRIGHT_BROWSER_CHANNEL }}
      PLAYWRIGHT_HEADLESS: ${{ secrets.PLAYWRIGHT_HEADLESS }}
      PLAYWRIGHT_AUTH_STATE: ${{ secrets.PLAYWRIGHT_AUTH_STATE }}
      WORKSPACE_NAME: ${{ secrets.WORKSPACE_NAME }}
      AGENT_NAME: ${{ secrets.AGENT_NAME }}
      ORG_ID: ${{ secrets.ORG_ID }}
      BASE_URL: ${{ secrets.BASE_URL }}
      CHATBOT_AGENT: ${{ secrets.CHATBOT_AGENT }}
      TESTDINO_API_KEY: ${{ secrets.TESTDINO_API_KEY }}
      TESTING_AGENT: ${{ secrets.TESTING_AGENT }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Run TestDino Playwright tests
      run: npx tdpw test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Deploy Playwright Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
