name: Playwright Tests
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write   # REQUIRED for GitHub Pages push
jobs:
  test:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_USER_DATA_DIR: ${{ secrets.PLAYWRIGHT_USER_DATA_DIR }}
      PLAYWRIGHT_LOGIN_URL: ${{ secrets.PLAYWRIGHT_LOGIN_URL }}
      PLAYWRIGHT_SUCCESS_URL: ${{ secrets.PLAYWRIGHT_SUCCESS_URL }}
      PLAYWRIGHT_BROWSER_CHANNEL: ${{ secrets.PLAYWRIGHT_BROWSER_CHANNEL }}
      PLAYWRIGHT_HEADLESS: ${{ secrets.PLAYWRIGHT_HEADLESS }}
      PLAYWRIGHT_AUTH_STATE: ${{ secrets.PLAYWRIGHT_AUTH_STATE }}
      WORKSPACE_NAME: ${{ secrets.WORKSPACE_NAME }}
      AGENT_NAME: ${{ secrets.AGENT_NAME }}
      ORG_ID: ${{ secrets.ORG_ID }}
      BASE_URL: ${{ secrets.BASE_URL }}
      CHATBOT_AGENT: ${{ secrets.CHATBOT_AGENT }}
      TESTING_AGENT: ${{ secrets.TESTING_AGENT }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test tests/chatbot-agent/configure-chatbot-config.spec.ts -g TC-CB-CFG-03
    - name: Generate failure summary
      if: always()
      run: |
        node << 'EOF'
        const fs = require("fs");

        if (!fs.existsSync("test-results.json")) {
          fs.writeFileSync("summary.txt","No test report found.");
          process.exit(0);
        }

        const report = JSON.parse(fs.readFileSync("test-results.json","utf8"));

        let failed = [];
        let passed = 0;
        let total = 0;

        function walkSuite(suite){
          if (!suite.specs) return;

          suite.specs.forEach(spec=>{
            spec.tests.forEach(test=>{
              total++;

              const result = test.results[0];

              if(result.status === "failed"){
                failed.push({
                  name: spec.title,
                  error: result.error?.message || "Unknown error"
                });
              }

              if(result.status === "passed"){
                passed++;
              }
            });
          });

          if(suite.suites){
            suite.suites.forEach(walkSuite);
          }
        }

        report.suites.forEach(walkSuite);

        let summary = `Playwright Test Results

        Total: ${total}
        Passed: ${passed}
        Failed: ${failed.length}
        `;

        if(failed.length){
          summary += "\nFailed Tests\n";

          failed.forEach((t,i)=>{
            summary += `\n${i+1}. ${t.name}\n   Reason: ${t.error}\n`;
          });
        }

        fs.writeFileSync("summary.txt", summary);

        console.log(summary);
        EOF
    - name: Debug summary
      run: cat summary.txt
    - name: Upload summary
      uses: actions/upload-artifact@v4
      with:
        name: test-summary
        path: summary.txt
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload Pages artifact
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: playwright-report

  deploy:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send Report + Summary
        run: |
          SUMMARY=$(cat summary.txt | tr '\n' '\\n')

          curl -X POST https://flow.sokt.io/func/scri8acRJpTe \
          -H "Content-Type: application/json" \
          -d "{\"report_url\":\"${{ steps.deployment.outputs.page_url }}\",\"summary\":\"$SUMMARY\"}"

        
