name: Playwright Tests
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write   # REQUIRED for GitHub Pages push
jobs:
  test:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    outputs:
      failed_summary: ${{ steps.summary.outputs.FAILED_SUMMARY }}
      test_outcome: ${{ steps.summary.outputs.test_outcome }}
    env:
      PLAYWRIGHT_USER_DATA_DIR: ${{ secrets.PLAYWRIGHT_USER_DATA_DIR }}
      PLAYWRIGHT_LOGIN_URL: ${{ secrets.PLAYWRIGHT_LOGIN_URL }}
      PLAYWRIGHT_SUCCESS_URL: ${{ secrets.PLAYWRIGHT_SUCCESS_URL }}
      PLAYWRIGHT_BROWSER_CHANNEL: ${{ secrets.PLAYWRIGHT_BROWSER_CHANNEL }}
      PLAYWRIGHT_HEADLESS: ${{ secrets.PLAYWRIGHT_HEADLESS }}
      PLAYWRIGHT_AUTH_STATE: ${{ secrets.PLAYWRIGHT_AUTH_STATE }}
      WORKSPACE_NAME: ${{ secrets.WORKSPACE_NAME }}
      AGENT_NAME: ${{ secrets.AGENT_NAME }}
      ORG_ID: ${{ secrets.ORG_ID }}
      BASE_URL: ${{ secrets.BASE_URL }}
      CHATBOT_AGENT: ${{ secrets.CHATBOT_AGENT }}
      TESTING_AGENT: ${{ secrets.TESTING_AGENT }}
      AGENT_ID: ${{ secrets.AGENT_ID }}
      CHATBOT_AGENT_ID: ${{ secrets.CHATBOT_AGENT_ID }}
      TESTING_AGENT_ID: ${{ secrets.TESTING_AGENT_ID }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      id: test-run
      continue-on-error: true
      run: npx playwright test
    - name: Extract failed test summary
      if: always()
      id: summary
      run: |
        if [ -f test-results.json ]; then
          FAILED_SUMMARY=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
            const failed = [];
            function extractLocation(stack) {
              if (!stack) return '';
              const lines = stack.split('\\n');
              for (const line of lines) {
                const m = line.match(/at.*?([\\/\\\\][\\w.-]+\\.spec\\.ts:\\d+:\\d+)/);
                if (m) return m[1];
              }
              return '';
            }
            function extractSelector(msg) {
              if (!msg) return '';
              const m = msg.match(/waiting for (locator\\(.*?\\))/);
              if (m) return m[1];
              const m2 = msg.match(/locator\\(.*?\\)/);
              if (m2) return m2[0];
              return '';
            }
            function walk(suites) {
              for (const suite of suites || []) {
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    if (test.status === 'unexpected' || test.status === 'flaky') {
                      for (const r of test.results) {
                        if (r.status === 'failed' || r.status === 'timedOut') {
                          const msg = (r.error && r.error.message) ? r.error.message.split('\\n')[0] : r.status;
                          const loc = extractLocation(r.error && r.error.stack);
                          const sel = extractSelector(r.error && r.error.message);
                          let detail = spec.file + ' > ' + spec.title + '\\n  Error: ' + msg;
                          if (sel) detail += '\\n  Selector: ' + sel;
                          if (loc) detail += '\\n  Location: ' + loc;
                          failed.push(detail);
                        }
                      }
                    }
                  }
                }
                walk(suite.suites);
              }
            }
            walk(data.suites);
            if (failed.length === 0) { console.log('All tests passed'); }
            else { console.log('Failed (' + failed.length + '):\\n\\n' + failed.join('\\n\\n')); }
          ")
          echo "FAILED_SUMMARY<<EOF" >> $GITHUB_OUTPUT
          echo "$FAILED_SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "test_outcome=${{ steps.test-run.outcome }}" >> $GITHUB_OUTPUT
        else
          echo "FAILED_SUMMARY=No test-results.json found" >> $GITHUB_OUTPUT
          echo "test_outcome=${{ steps.test-run.outcome }}" >> $GITHUB_OUTPUT
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload Pages artifact
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: playwright-report

  deploy:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send Report URL and Summary to Webhook
        if: always()
        run: |
          SUMMARY=$(cat <<'ENDOFSUMMARY'
          ${{ needs.test.outputs.failed_summary }}
          ENDOFSUMMARY
          )
          OUTCOME="${{ needs.test.outputs.test_outcome }}"
          PAYLOAD=$(jq -n \
            --arg report_url "${{ steps.deployment.outputs.page_url }}" \
            --arg status "$OUTCOME" \
            --arg failed_summary "$SUMMARY" \
            '{report_url: $report_url, status: $status, failed_summary: $failed_summary}')
          curl -X POST https://flow.sokt.io/func/scri8acRJpTe \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
